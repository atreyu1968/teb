<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Elementos patrimoniales</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:22px}h1{margin:0 0 6px}.muted{color:#64788c}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.zone{background:#fff;border:2px dashed #a9bac9;border-radius:14px;min-height:210px;padding:12px}.zone h2{text-align:center}.pool{display:flex;flex-wrap:wrap;gap:9px;background:#eaf1f7;border-radius:14px;padding:14px;min-height:80px}.card{background:#1769aa;color:#fff;border-radius:9px;padding:9px 11px;cursor:grab;user-select:none}.card.selected{outline:4px solid #f4b942}.actions{display:flex;gap:10px;margin-top:16px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.secondary{background:#dbe7f0;color:#17324d}.msg{margin-top:15px;padding:12px;border-radius:10px;background:#fff;border:1px solid #d7e0e8}.ok{border-color:#61b894;background:#effaf5}.bad{border-color:#e49b9b;background:#fff4f4}@media(max-width:760px){.zones{grid-template-columns:1fr}.zone{min-height:120px}}</style></head><body><div class="wrap"><h1>Clasifica el patrimonio</h1><p class="muted">Arrastra cada tarjeta o tócala y después toca la masa patrimonial. Puedes repetir hasta dominar la clasificación.</p><div id="pool" class="pool"></div><div class="zones"><div class="zone" data-type="activo"><h2>Activo</h2></div><div class="zone" data-type="pasivo"><h2>Pasivo</h2></div><div class="zone" data-type="patrimonio"><h2>Patrimonio neto</h2></div></div><div class="actions"><button id="check">Comprobar</button><button id="reset" class="secondary">Reiniciar</button></div><div id="msg" class="msg">Coloca las 12 tarjetas y comprueba.</div></div><script>
const items=[['Caja','activo'],['Banco c/c','activo'],['Clientes','activo'],['Mercaderías','activo'],['Vehículo','activo'],['Mobiliario','activo'],['Proveedores','pasivo'],['Préstamo bancario','pasivo'],['Deuda con Hacienda','pasivo'],['Deuda con Seguridad Social','pasivo'],['Capital social','patrimonio'],['Reservas','patrimonio']];
const pool=document.getElementById('pool'),msg=document.getElementById('msg');let selected=null,attempts=0;
function build(){pool.innerHTML='';document.querySelectorAll('.zone .card').forEach(x=>x.remove());items.sort(()=>Math.random()-.5).forEach(([name,type],i)=>{const c=document.createElement('div');c.className='card';c.textContent=name;c.dataset.type=type;c.draggable=true;c.id='c'+i;c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.id));c.addEventListener('click',()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));selected=c;c.classList.add('selected')});pool.appendChild(c)});msg.className='msg';msg.textContent='Coloca las 12 tarjetas y comprueba.'}
document.querySelectorAll('.zone').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();const c=document.getElementById(e.dataTransfer.getData('text/plain'));if(c)z.appendChild(c)});z.addEventListener('click',e=>{if(e.target.closest('.card'))return;if(selected){z.appendChild(selected);selected.classList.remove('selected');selected=null}})});
document.getElementById('check').onclick=()=>{attempts++;const cards=[...document.querySelectorAll('.card')];let correct=0;cards.forEach(c=>{const zone=c.closest('.zone');const ok=zone&&zone.dataset.type===c.dataset.type;c.style.background=ok?'#12805c':'#b42318';if(ok)correct++});const score=Math.round(correct/cards.length*100);msg.className='msg '+(score>=80?'ok':'bad');msg.textContent=`Resultado: ${correct}/${cards.length} · ${score} %. ${score>=80?'Actividad superada.':'Revisa las tarjetas rojas y vuelve a intentarlo.'}`;window.parent.postMessage({type:'teb-activity-result',ref:'basic-game',score,attempts,criteria:['RA1.d','RA1.e','RA1.g'],complete:score>=80},'*')};document.getElementById('reset').onclick=build;build();
</script></body></html>
