<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UD2 · Examen</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#eef3f7}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d7e1e7;border-radius:12px;padding:18px;margin-bottom:14px}.progress{height:12px;background:#dfe7ec;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#244f69}.option{display:block;border:1px solid #d7e1e7;border-radius:8px;padding:10px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.criterion{border:1px solid #d7e1e7;border-radius:8px;padding:10px}.muted{color:#667783}.hidden{display:none!important}.locked{background:#fff4e5;border-left:5px solid #b26a00}.good{background:#e9f6ef;color:#176b48}.bad{background:#fff0ee;color:#9a3029}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="statusCard" class="card"><h1>UD2 · Examen RA2</h1><p>100 preguntas seleccionadas de un banco independiente de 300.</p><p><strong>Penalización:</strong> cada error descuenta 0,5 aciertos. Las preguntas en blanco no suman ni restan. Un único intento.</p><div id="availability"></div></div><div id="examCard" class="card hidden"><div class="progress"><div id="bar"></div></div><p id="counter" class="muted"></p><div id="question"></div><div class="actions"><button id="prevBtn" class="btn secondary">Anterior</button><button id="nextBtn" class="btn secondary">Siguiente</button><button id="submitBtn" class="btn">Entregar examen</button></div></div><div id="resultCard" class="card hidden"><h2>Resultado</h2><div id="summary"></div><div id="criteria" class="grid"></div><button id="reportBtn" class="btn secondary" style="margin-top:14px">Descargar informe</button></div></div><script src="ud2-course.js"></script><script src="ud2-exam-bank.js"></script><script src="ud2-exam.js"></script></body></html>
