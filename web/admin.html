<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEB · Administración</title><link rel="stylesheet" href="admin.css"></head><body>
<section id="adminLogin" class="auth-wrap"><div class="auth-card"><h1>TEB · Panel docente</h1><p class="muted">Seguimiento de Técnica Contable · UD1 · RA1</p><div class="field"><label>Usuario</label><input id="adminUser" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="adminPass" type="password" autocomplete="current-password"></div><button id="adminLoginBtn" class="btn">Entrar</button><div id="loginMsg" class="notice hidden"></div><p><a href="index.html">← Volver al acceso del alumnado</a></p></div></section>
<div id="adminApp" class="hidden"><header class="topbar"><div class="brand"><strong>TEB · Panel docente</strong><span>UD1 · El patrimonio empresarial en Canarias</span></div><div class="top-actions"><button id="exportBtn" class="btn secondary">Exportar CSV</button><button id="adminLogout" class="btn secondary">Salir</button></div></header><div class="admin-wrap"><div class="toolbar"><button id="newStudent" class="btn">+ Alumno</button><button id="newGroup" class="btn secondary">+ Grupo</button><button id="refreshBtn" class="btn secondary">Actualizar</button></div><div class="grid2"><section class="panel"><h2>Grupos</h2><div id="groupsList"></div><hr><h3>Resumen</h3><div id="summary"></div></section><section class="panel"><h2>Alumnado y seguimiento</h2><div class="table-wrap"><table><thead><tr><th>Alumno</th><th>Grupo</th><th>Estado</th><th>Progreso</th><th>Nota</th><th>Tiempo</th><th>Criterios</th><th>Acciones</th></tr></thead><tbody id="studentsBody"></tbody></table></div></section></div></div></div>
<div id="dialog" class="dialog hidden"><div class="dialog-card"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button id="dialogSave" class="btn">Guardar</button><button id="dialogCancel" class="btn secondary">Cancelar</button></div></div></div>
<div id="eventsDialog" class="dialog hidden"><div class="dialog-card"><h2 id="eventsTitle">Actividad del alumno</h2><div id="eventsList" class="event-list"></div><div class="actions"><button id="eventsClose" class="btn secondary">Cerrar</button></div></div></div>
<script src="admin.js"></script></body></html>
