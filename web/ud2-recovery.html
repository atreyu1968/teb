<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UD2 · Recuperación</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#eef3f7}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d7e1e7;border-radius:12px;padding:18px;margin-bottom:14px}.criterion{border-left:5px solid #9a3029}.ok{border-left:5px solid #176b48}.muted{color:#667783}.tag{display:inline-block;background:#e8eef2;border-radius:20px;padding:4px 8px;margin:2px}.option{display:block;border:1px solid #d7e1e7;border-radius:8px;padding:10px;margin:7px 0;cursor:pointer}.option:hover{background:#f5f9fb}.stage{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stage span{padding:5px 9px;border-radius:20px;background:#e7eff3}.stage .active{background:#16384d;color:#fff}.progress{height:10px;background:#e1e8ec;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#244f69}.good{background:#e9f6ef;border:1px solid #b7dfc9;color:#176b48;padding:12px;border-radius:8px}.bad{background:#fff0ee;border:1px solid #edc0ba;color:#9a3029;padding:12px;border-radius:8px}.hint{background:#fff9df;border-left:4px solid #b8860b;padding:12px;margin:10px 0}.hidden{display:none!important}.criteria-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}@media(max-width:800px){.criteria-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>UD2 · Recuperación personalizada</h1><p>Trabajarás únicamente los criterios no superados con actividades nuevas. Primero completarás un refuerzo con pistas; después una prueba de dominio. En los criterios contables prácticos habrá además una comprobación aplicada.</p><div id="summary"></div></div><div id="content"></div></div><script src="ud2-course.js"></script><script src="ud2-recovery-bank.js"></script><script src="ud2-recovery.js"></script></body></html>
