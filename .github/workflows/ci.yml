name: TEB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare and validate MicroSCORM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          chmod +x scripts/extract-scorms.sh
          scripts/extract-scorms.sh
          for d in micro-scorm-de micro-scorm-f micro-scorm-g; do
            test -f "web/reutilizados/$d/index.html"
            test -f "web/reutilizados/$d/imsmanifest.xml"
            grep -qi 'scormtype="sco"' "web/reutilizados/$d/imsmanifest.xml"
          done

      - name: Check JavaScript syntax
        run: |
          node --check server/server.mjs
          node --check web/app.js
          node --check web/admin.js
          node --check web/course.js
          node --check web/ud2-course.js
          node --check web/ud2-bank.js
          node --check web/ud2-simulator.js
          node --check scripts/check-ud2.mjs
          node --check scripts/check-multiunit.mjs
          for d in micro-scorm-de micro-scorm-f micro-scorm-g; do
            node --check "web/reutilizados/$d/app.js"
            node --check "web/reutilizados/$d/scorm.js"
          done

      - name: Validate UD2 pedagogical structure
        run: node scripts/check-ud2.mjs

      - name: Validate multiunit backend and RA2 assessment
        run: node scripts/check-multiunit.mjs

      - name: Start TEB and check public endpoints
        run: |
          export DATA_DIR=/tmp/teb-ci-final
          cd server
          node server.mjs > /tmp/teb.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              grep -q 'teb-ud1-ra1' /tmp/health.json
              grep -q 'teb-ud2-ra2' /tmp/health.json
              curl -fsS http://127.0.0.1:8080/api/courses | grep -q 'teb-ud2-ra2'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/teb.log
          exit 1
